<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#04050b">
    <meta name="description" content="A polished, privacy-friendly calculator for everyday arithmetic.">
    <title>The Simple Calculator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff9500'/%3E%3Ctext x='50' y='74' font-size='68' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23ffffff'%3E=%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scene" aria-hidden="true">
        <div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div>
        <div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div>
        <div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div>
        <div class="blob"></div><div class="blob"></div>
        <div class="dots"></div><div class="vignette"></div>
    </div>

    <main class="calculator" aria-label="Simple calculator">
        <header class="brand" aria-hidden="true">
            <span class="brand-line"></span><span class="brand-name">The Simple Calculator</span><span class="brand-line"></span>
        </header>
        <div class="inputs-wrapper">
            <input type="text" id="num1" class="input-box" placeholder="0000" inputmode="decimal" aria-label="First number" autocomplete="off" spellcheck="false">
            <input type="text" id="num2" class="input-box" placeholder="0000" inputmode="decimal" aria-label="Second number" autocomplete="off" spellcheck="false">
        </div>
        <div class="operators" id="operators" role="group" aria-label="Operator">
            <button type="button" class="operator-button active" data-op="+" aria-pressed="true" aria-label="Add">+</button>
            <button type="button" class="operator-button" data-op="-" aria-pressed="false" aria-label="Subtract">−</button>
            <button type="button" class="operator-button" data-op="*" aria-pressed="false" aria-label="Multiply">×</button>
            <button type="button" class="operator-button" data-op="/" aria-pressed="false" aria-label="Divide">÷</button>
        </div>
        <button type="button" class="equals-button" id="equals" aria-label="Calculate">=</button>
        <output class="result-box" id="result" for="num1 num2" aria-live="polite" title="Hold to copy"><span class="result-text" id="resultText">0</span></output>
        <p class="hint" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Hold result to copy</span></p>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
